name: Daily Solar AI Report

on:
  schedule:
    - cron: '0 10 * * *' # Runs at 10:00 UTC (07:00 AM BRT)
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests google-generativeai

      - name: Run AI Analysis Script
        env:
          APP_ID: ${{ secrets.AUXSOL_APP_ID }}
          APP_SECRET: ${{ secrets.AUXSOL_APP_SECRET }}
          PLANT_ID: ${{ secrets.PLANT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python main.py
